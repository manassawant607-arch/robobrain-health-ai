<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=./" />
    <title>RoboBrain Health AI</title>
    <script>
      // SPA fallback for GitHub Pages: any unknown path reloads to the app root,
      // where React Router (basename-aware) serves the correct page.
      sessionStorage.setItem('redirect', location.href)
      location.replace(location.pathname.replace(/[^/]*$/, ''))
    </script>
  </head>
  <body>
    <p>Redirecting to RoboBrain Health AI…</p>
  </body>
</html>
